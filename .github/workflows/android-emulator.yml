name: Emulator Smoke Test

# Launches the :app debug APK on a real Android emulator. MANDATORY (gates the job and any release):
# the instrumented tests listed in scripts/ci/emulator-smoke.sh (launch, corrupt persisted state, recreation and
# background/resume, every primary tab, repeated launches) judged by scripts/ci/verify-instrumentation.py, and the
# cold-start fault matrix (scripts/qa/startup-matrix.sh). BEST-EFFORT, never gating: PrimaryScreensScreenshotTest
# (walks Chat/Tools/Notes/Memory/Settings/Pilot/Forge/Logs and dumps PNGs for the README).
# This is the first thing in this repo that actually RUNS the app on an Android
# runtime — every :app addendum in docs/AUDIT_2026-09-05.md through slice 3 ends
# with "no device or emulator". A green run here moves the app launch path past
# ON DISK / UNVERIFIED. Screens past first composition are now exercised too.
#
# Heavy native build (llama.cpp + sherpa-onnx), same as android-apk.yml, plus a
# hardware-accelerated (KVM) x86_64 emulator — so this is NOT wired to every
# pull_request. Triggers:
#   - workflow_dispatch (always)
#   - push to main, except docs-only commits
#   - PRs that touch the app, this workflow, or the Gradle files that decide
#     whether :app still assembles

on:
  workflow_dispatch:
  # android-apk.yml calls this workflow before it will publish a pre-release, so the validation below runs on the
  # exact commit being released.
  workflow_call:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "signing/**"
      - ".github/workflows/android-emulator.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Launch :app on emulator (API 28, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # KVM is present on GitHub's Linux runners but not writable by default;
      # the emulator needs hardware acceleration to boot in reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package install fails; pull exact packages below.
          packages: ""

      - name: Install SDK packages (compileSdk 36, NDK r28c, CMake 3.22.1)
        run: bash scripts/ci/install-sdk-packages.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ggml-vulkan's host tool (vulkan-shaders-gen) is configured with -GNinja and looks
      # ninja up on PATH. The SDK CMake package ships it; the runner image may not.
      - name: Put SDK CMake ninja on PATH
        run: echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # Build the app and test APKs before the emulator step. Retry only transient
      # Maven Central / network errors — a compile error is not a 429, and retrying
      # it six times burned ~25 minutes on run #2 (Actions 38357634068).
      # ABI is pinned to the emulator's x86_64; the 4-ABI APK is android-apk.yml's job.
      - name: Assemble app + androidTest APKs (retry transient Maven Central 429s)
        run: |
          set -o pipefail
          delay=15
          for attempt in 1 2 3 4 5 6; do
            echo "::group::assemble attempt #${attempt}"
            log="$(mktemp)"
            if ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
                 -PincludeAndroid=true \
                 -Pandroid.injected.build.abi=x86_64 \
                 --no-daemon 2>&1 | tee "$log"; then
              echo "::endgroup::"
              echo "BUILD OK on attempt #${attempt}"
              rm -f "$log"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -qE \
              'Could not GET |Could not HEAD |Received status code 429|Connection reset|SocketTimeout|UnknownHostException|Connection timed out|503 Service Unavailable|502 Bad Gateway' \
              "$log"; then
              echo "Non-transient assemble failure; not retrying"
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            if [ "${attempt}" -eq 6 ]; then
              echo "assemble failed after all retries"
              exit 1
            fi
            echo "attempt #${attempt} failed with a transient dependency error; sleeping ${delay}s before retry"
            sleep "${delay}"
            delay=$((delay * 2))
            if [ "${delay}" -gt 300 ]; then delay=300; fi
          done
          echo "assemble failed after all retries"
          exit 1

      - name: Run launch smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          # NDK r28c is already installed above; the action does not need to resolve it.
          ndk: "28.2.13676358"
          cmake: "3.22.1"
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Streamed adb install: Gradle's connected split-installer failed on the
          # 208 MB x86_64 APK locally ("Failed to install-write all apks").
          # Screenshots are pulled while the emulator is still up.
          script: bash scripts/ci/emulator-smoke.sh

      # Raw runner output, verdicts, the fault-matrix table and (on failure) sanitized crash/ANR logcat.
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: emulator-evidence
          path: |
            emulator-logs/*.log
            emulator-logs/*.md
            emulator-logs/*.tsv
            emulator-logs/*.txt
          if-no-files-found: warn
          retention-days: 14

      # Only a run that reached "VALIDATION PASSED" writes this file; the release job reads it for its notes.
      - name: Upload validation summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: emulator-logs/validation-summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: emulator-screenshots
          path: emulator-screenshots/**
          if-no-files-found: warn
          retention-days: 7
