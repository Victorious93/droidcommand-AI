name: Emulator Smoke Test

# Launches the :app debug APK on a real Android emulator and runs instrumented
# tests: MainActivityLaunchTest (RESUMED) and PrimaryScreensScreenshotTest
# (walks Chat/Tools/Notes/Memory/Settings/Pilot/Forge/Logs and dumps PNGs).
# This is the first thing in this repo that actually RUNS the app on an Android
# runtime — every :app addendum in docs/AUDIT_2026-09-05.md through slice 3 ends
# with "no device or emulator". A green run here moves the app launch path past
# ON DISK / UNVERIFIED. Screens past first composition are now exercised too.
#
# Heavy native build (llama.cpp + sherpa-onnx), same as android-apk.yml, plus a
# hardware-accelerated (KVM) x86_64 emulator — so this is NOT wired to every
# pull_request. Triggers:
#   - workflow_dispatch (always)
#   - push to main, except docs-only commits
#   - PRs that touch the app, this workflow, or the Gradle files that decide
#     whether :app still assembles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/android-emulator.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Launch :app on emulator (API 28, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # KVM is present on GitHub's Linux runners but not writable by default;
      # the emulator needs hardware acceleration to boot in reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package install fails; pull exact packages below.
          packages: ""

      - name: Install SDK packages (compileSdk 36, NDK r28c, CMake 3.22.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ggml-vulkan's host tool (vulkan-shaders-gen) is configured with -GNinja and looks
      # ninja up on PATH. The SDK CMake package ships it; the runner image may not.
      - name: Put SDK CMake ninja on PATH
        run: echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # Build the app and test APKs before the emulator step. Retry only transient
      # Maven Central / network errors — a compile error is not a 429, and retrying
      # it six times burned ~25 minutes on run #2 (Actions 38357634068).
      # ABI is pinned to the emulator's x86_64; the 4-ABI APK is android-apk.yml's job.
      - name: Assemble app + androidTest APKs (retry transient Maven Central 429s)
        run: |
          set -o pipefail
          delay=15
          for attempt in 1 2 3 4 5 6; do
            echo "::group::assemble attempt #${attempt}"
            log="$(mktemp)"
            if ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
                 -PincludeAndroid=true \
                 -Pandroid.injected.build.abi=x86_64 \
                 --no-daemon 2>&1 | tee "$log"; then
              echo "::endgroup::"
              echo "BUILD OK on attempt #${attempt}"
              rm -f "$log"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -qE \
              'Could not (GET|HEAD|resolve)|Received status code 429|Connection reset|SocketTimeout|UnknownHostException|Connection timed out|503 Service Unavailable|502 Bad Gateway' \
              "$log"; then
              echo "Non-transient assemble failure; not retrying"
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            if [ "${attempt}" -eq 6 ]; then
              echo "assemble failed after all retries"
              exit 1
            fi
            echo "attempt #${attempt} failed with a transient dependency error; sleeping ${delay}s before retry"
            sleep "${delay}"
            delay=$((delay * 2))
            if [ "${delay}" -gt 300 ]; then delay=300; fi
          done
          echo "assemble failed after all retries"
          exit 1

      - name: Run launch smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          # NDK r28c is already installed above; the action does not need to resolve it.
          ndk: "28.2.13676358"
          cmake: "3.22.1"
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The APKs are already assembled above; this only installs and runs the test,
          # so no 429-retry wrapper is needed here. Screenshots are pulled while the
          # emulator is still up (PrimaryScreensScreenshotTest writes /data/local/tmp/dca-screenshots).
          script: |
            set -euo pipefail
            ./gradlew :app:connectedDebugAndroidTest -PincludeAndroid=true -Pandroid.injected.build.abi=x86_64 --no-daemon
            mkdir -p "$GITHUB_WORKSPACE/emulator-screenshots"
            adb pull /data/local/tmp/dca-screenshots "$GITHUB_WORKSPACE/emulator-screenshots" || true

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator-screenshots/**
          if-no-files-found: warn
          retention-days: 30
