name: Build APK

# Builds the :app debug APK and uploads it as a downloadable workflow artifact.
# Kept separate from ci.yml because this is a heavy native build (Android SDK +
# NDK r28c + CMake; llama.cpp for arm64-v8a/x86_64 plus sherpa-onnx's 4-ABI AAR).
# It does NOT run on every pull_request — ordinary JVM and :app Kotlin PRs stay
# on ci.yml / android-emulator.yml. Triggers:
#   - workflow_dispatch (always)
#   - push to main, except docs-only commits
#   - PRs that touch this workflow, the native modules packaged into the APK,
#     or the Gradle files that decide whether :app still assembles
#
# The produced APK is debug-signed. A separate workflow
# (.github/workflows/android-emulator.yml) launches an x86_64-only build and
# runs the instrumented smoke test; see the 2026-10-13 / 2026-10-14 audit
# addenda. This job is the 4-ABI artifact, not a launch proof.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "core-llm-local-android/**"
      - "core-voice-neural-android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build :app debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default install of the obsolete legacy "tools" package fails
          # ("Failed to find package 'tools'"); install nothing here and let
          # the explicit step below pull the exact packages we need.
          packages: ""

      - name: Install SDK packages (compileSdk 36, NDK r28c, CMake 3.22.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ggml-vulkan's host tool (vulkan-shaders-gen) is configured with -GNinja and looks
      # ninja up on PATH. The SDK CMake package ships it; the runner image may not.
      - name: Put SDK CMake ninja on PATH
        run: echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # Retry only transient Maven Central / network errors — a compile error is
      # not a 429. The previous wrapper retried PilotController.kt:65 six times
      # on Actions 38503712187 / 38504189408 (~23 min each) after Mode 1/2
      # landed on the stale feature branch.
      - name: Assemble debug APK (retry transient Maven Central 429s)
        run: |
          set -o pipefail
          delay=15
          for attempt in 1 2 3 4 5 6; do
            echo "::group::assembleDebug attempt #${attempt}"
            log="$(mktemp)"
            if ./gradlew :app:assembleDebug -PincludeAndroid=true --no-daemon \
                 2>&1 | tee "$log"; then
              echo "::endgroup::"
              echo "BUILD OK on attempt #${attempt}"
              rm -f "$log"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -qE \
              'Could not (GET|HEAD|resolve)|Received status code 429|Connection reset|SocketTimeout|UnknownHostException|Connection timed out|503 Service Unavailable|502 Bad Gateway' \
              "$log"; then
              echo "Non-transient assemble failure; not retrying"
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            if [ "${attempt}" -eq 6 ]; then
              echo "assembleDebug failed after all retries"
              exit 1
            fi
            echo "attempt #${attempt} failed with a transient dependency error; sleeping ${delay}s before retry"
            sleep "${delay}"
            delay=$((delay * 2))
            if [ "${delay}" -gt 300 ]; then delay=300; fi
          done
          echo "assembleDebug failed after all retries"
          exit 1

      - name: Show APK identity
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort | tail -1)
          "${BT}aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion:|targetSdkVersion:|application-label:" || true

      - name: Record APK checksum
        if: success()
        working-directory: app/build/outputs/apk/debug
        run: |
          sha256sum app-debug.apk | tee SHA256SUMS

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
